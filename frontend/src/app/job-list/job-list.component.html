<!--
  Pour l'implémentation EventEmitter, décommentez la ligne suivante.
  Elle inclut le composant enfant et écoute son événement 'jobCreated'.
-->
<!-- <app-create-job (jobCreated)="onJobCreated($event)"></app-create-job> -->

<div class="job-list-container">
  <mat-card *ngFor="let job of jobs" class="job-card" data-testid="job-card">
    <mat-card-header>
      <mat-card-title data-testid="job-title">{{ job.title }}</mat-card-title>
      <mat-card-subtitle>{{ job.speciality }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>{{ job.description }}</p>
    </mat-card-content>
    <mat-card-footer>
      <p><strong data-testid="job-location">Lieu :</strong> {{ job.location }}</p>
    </mat-card-footer>
  </mat-card>
</div>
