<div class="create-job-container">
  <h1 class="create-job-title">Create a New Job Offer</h1>

  <form [formGroup]="jobForm" (ngSubmit)="submitForm()" class="job-form">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" required data-testid="title-input">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" required data-testid="description-input"></textarea>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Location</mat-label>
      <input matInput formControlName="location" [matAutocomplete]="auto" required data-testid="location-input">
      <mat-autocomplete #auto="matAutocomplete">
        <mat-option *ngFor="let city of citySuggestions$ | async" [value]="city">
          {{ city }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Specialty</mat-label>
      <input matInput formControlName="speciality" required data-testid="speciality-input">
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="jobForm.invalid" class="submit-button" data-testid="submit-button">
      <mat-icon>save</mat-icon> Save Job Offer
    </button>
  </form>
</div>
