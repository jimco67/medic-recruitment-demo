name: 'Revue de Code Automatique avec Gemini'

# Déclenche le workflow à chaque fois qu'une Pull Request est ouverte ou mise à jour
on:
  pull_request:
    types: [opened, synchronize]
# Définit les permissions nécessaires pour que le workflow puisse interagir avec la PR
permissions:
  pull-requests: write # Permet d'écrire des commentaires et de faire des reviews
  contents: read      # Permet de lire le contenu du code
jobs:
  gemini_code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lancer la revue de code par Gemini
        run: |
          gemini --prompt "En tant que lead developer, fais une revue de code stricte et détaillée pour la pull request #${{ github.event.pull_request.number }}. Compare les changements avec le code existant, sois strict sur la non-utilisation de données inutiles et les erreurs.
          Analyse la logique du développement et rejette tout ce qui est inutile ou ne respecte pas les conventions du projet. Finalement, poste tes conclusions en commentaire de la PR."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
