name: Spring Boot CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Étape 1: Récupère le code source du dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape 2: Configure l'environnement Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Étape 3: Met en cache les dépendances Maven
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Étape 4: Rend le Maven Wrapper exécutable
      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      # Vérifier que Docker fonctionne
      - name: Check Docker version
        run: docker version

      # Lancer les tests (unitaires + Cucumber + Testcontainers)
      - name: Run tests with Maven (Cucumber & Testcontainers)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock
        run: ./mvnw -B clean verify
